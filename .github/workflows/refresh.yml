name: Refresh the official standings

# A consumer wants a decided check no older than a day or so (PayoutGate's max age is set when it is deployed);
# left alone, the official CANONICAL standings age out. This asks TokenOrigin for a fresh check of each
# (subject, token) pair the live proof found canonical, twice a day: one consensus transaction each, in which
# every validator reads the issuer's page and the chain's public nodes. It signs with a throwaway testnet account
# funded from Studio Next's faucet (studio-next/refresh.ts). No secrets.
on:
  schedule:
    - cron: "41 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-next/package-lock.json
      - run: npm ci
      - run: npx tsx refresh.ts
